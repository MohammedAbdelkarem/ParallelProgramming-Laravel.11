global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Load GeoIP Lua script
    lua-load /etc/haproxy/geoip.lua

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# -------------------------------
# FRONTEND: COUNTRY‑BASED ROUTING
# -------------------------------
frontend http_front
    bind *:80

    # Detect country using GeoIP
    http-request set-var(txn.country) lua.geoip_country

    # ACL: If country == SY (Syria)
    acl from_syria var(txn.country) -m str SY

    # Route based on country
    use_backend leastconn_cluster if from_syria
    use_backend iphash_cluster    if !from_syria

    default_backend leastconn_cluster

# -----------------------------------------
# BACKEND 1: LEAST CONNECTIONS (SYRIA ONLY)
# -----------------------------------------
backend leastconn_cluster
    balance leastconn

    option httpchk GET /health
    http-check expect status 200

    server web-app-01 10.0.0.11:80 check inter 3000 fall 3 rise 2
    server web-app-02 10.0.0.12:80 check inter 3000 fall 3 rise 2
    server web-app-03 10.0.0.13:80 check inter 3000 fall 3 rise 2

# ----------------------------------------------
# BACKEND 2: IP‑HASH (SOURCE HASHING) FOR GLOBAL
# ----------------------------------------------
backend iphash_cluster
    balance source   # Equivalent to IP‑Hash

    option httpchk GET /health
    http-check expect status 200

    server web-app-01 10.0.0.11:80 check inter 3000 fall 3 rise 2
    server web-app-02 10.0.0.12:80 check inter 3000 fall 3 rise 2
    server web-app-03 10.0.0.13:80 check inter 3000 fall 3 rise 2

#for this code we suppose that in syria we have +10 servers, and in the other countries we have one server in each country, this code is for HAProxy Tool

